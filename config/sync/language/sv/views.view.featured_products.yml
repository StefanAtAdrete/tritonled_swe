        nothing:
          alter:
            text: "<article class=\"card triton-family-card h-100 border-0 shadow-sm overflow-hidden\">\r\n<div class=\"card-img-wrap\">{{ field_product_media }}</div>\r\n<div class=\"card-body d-flex flex-column\">\r\n<h3 class=\"card-title h2 mb-2\">MAX / MAX-PRO</h3>\r\n<p class=\"text-muted\">Utbytbar optik. Arbetshästen för lager, produktion och verkstad.</p>\r\n<dl class=\"triton-family-specs mb-3\"><div><dt>Längd</dt><dd>0,5–2 m</dd></div><div><dt>Effekt</dt><dd>19–135 W</dd></div><div><dt>Ljusflöde</dt><dd>3 315–22 950 lm</dd></div><div><dt>Ljuseffekt</dt><dd>174–(170)–161 lm/W</dd></div><div class=\"triton-family-specs__wide\"><dt>Drivdon</dt><dd>Av/På, DALI2, B2L (D4i)</dd></div><div class=\"triton-family-specs__wide\"><dt>Anslutning</dt><dd>Förskruvning, Wago, Ensto</dd></div><div class=\"triton-family-specs__wide\"><dt>Kapsling</dt><dd>IP20 / IP43 · IK06</dd></div><div class=\"triton-family-specs__wide\"><dt>Livslängd</dt><dd>95 000 h vid ~25 °C (L80, B10)</dd></div></dl>\r\n<a href=\"/produkt/triton-max\" class=\"btn btn-outline-primary stretched-link align-self-start mt-auto\">Se MAX-serien <span aria-hidden=\"true\">→</span></a>\r\n</div>\r\n</article>"
