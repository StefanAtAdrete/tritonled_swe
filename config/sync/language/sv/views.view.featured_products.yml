  block_opti:
    display_options:
      fields:
        nothing:
          alter:
            text: "<article class=\"card triton-family-card h-100 border-0 shadow-sm overflow-hidden\">\r\n<div class=\"card-img-wrap\">{{ field_product_media }}</div>\r\n<div class=\"card-body d-flex flex-column\">\r\n<h3 class=\"card-title h2 mb-2\">OPTI</h3>\r\n<p class=\"text-muted\">Utbytbar optik. För höga tak och krävande ljusbilder.</p>\r\n<dl class=\"triton-family-specs mb-3\"><div><dt>Längd</dt><dd>0,6–2 m</dd></div><div><dt>Effekt</dt><dd>21–154 W</dd></div><div><dt>Ljusflöde</dt><dd>3 840–25 400 lm</dd></div><div><dt>Ljuseffekt</dt><dd>183–165 lm/W</dd></div><div class=\"triton-family-specs__wide\"><dt>Drivdon</dt><dd>Av/På, DALI2, B2L (D4i)</dd></div><div class=\"triton-family-specs__wide\"><dt>Anslutning</dt><dd>Förskruvning, Wago, Ensto</dd></div><div class=\"triton-family-specs__wide\"><dt>Kapsling</dt><dd>IP20 / IP43 · IK07</dd></div><div class=\"triton-family-specs__wide\"><dt>Livslängd</dt><dd>80 000 h vid ~40 °C (L80, B10)</dd></div></dl>\r\n<a href=\"/produkt/triton-opti\" class=\"btn btn-outline-primary stretched-link align-self-start mt-auto\">Se OPTI-serien <span aria-hidden=\"true\">→</span></a>\r\n</div>\r\n</article>"
