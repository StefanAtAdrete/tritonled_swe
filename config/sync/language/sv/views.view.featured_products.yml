  block_srow:
    display_options:
      fields:
        nothing:
          alter:
            text: "<article class=\"card triton-family-card h-100 border-0 shadow-sm overflow-hidden\">\r\n<div class=\"card-img-wrap\">{{ field_product_media }}</div>\r\n<div class=\"card-body d-flex flex-column\">\r\n<h3 class=\"card-title h2 mb-2\">SROW</h3>\r\n<p class=\"text-muted\">Tät armatur för garage, fukt och damm.</p>\r\n<dl class=\"triton-family-specs mb-3\"><div><dt>Längd</dt><dd>0,6–1,8 m</dd></div><div><dt>Effekt</dt><dd>17–75 W</dd></div><div><dt>Ljusflöde</dt><dd>3 110–13 050 lm</dd></div><div><dt>Ljuseffekt</dt><dd>183–174 lm/W</dd></div><div class=\"triton-family-specs__wide\"><dt>Drivdon</dt><dd>Av/På, DALI2, B2L (D4i)</dd></div><div class=\"triton-family-specs__wide\"><dt>Anslutning</dt><dd>Förskruvning</dd></div><div class=\"triton-family-specs__wide\"><dt>Kapsling</dt><dd>IP54 / IP65 · IK08</dd></div><div class=\"triton-family-specs__wide\"><dt>Livslängd</dt><dd>70 000 h vid ~50 °C (L80, B10)</dd></div></dl>\r\n<p class=\"small text-muted mt-auto mb-3\">0,6 m finns i Excelunderlaget men erbjuds inte i konfiguratorn.</p>\r\n<a href=\"/produkt/triton-srow-ip54ip65\" class=\"btn btn-outline-primary stretched-link align-self-start\">Se SROW-serien <span aria-hidden=\"true\">→</span></a>\r\n</div>\r\n</article>"
  block_3:
