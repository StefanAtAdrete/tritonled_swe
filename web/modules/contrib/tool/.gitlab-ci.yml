include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  OPT_IN_TEST_PREVIOUS_MAJOR: 1
  OPT_IN_TEST_NEXT_MINOR: 1
  OPT_IN_TEST_NEXT_MAJOR: 0
  RUN_JOB_UPGRADE_STATUS: 0
  OPT_IN_TEST_CURRENT: 1
  _PHPUNIT_CONCURRENT: 1
  _CSPELL_IGNORE_PATHS: "'.cspell-project-words.txt', 'tests/assets'"
pages:
  stage: .post

# The previous-major jobs default to Drupal 10's PHP minimum (8.1), but this
# module requires PHP >= 8.2; run them on a PHP version both support.
composer (previous major):
  variables:
    PHP_VERSION: '8.3'
phpunit (previous major):
  variables:
    PHP_VERSION: '8.3'
phpstan (previous major):
  variables:
    PHP_VERSION: '8.3'
  # The previous-major stack pins an older phpstan-drupal that lacks the
  # PHPUnit 11 attribute classes and uses different ignore identifiers;
  # its report is advisory. The current-core phpstan job remains blocking.
  allow_failure: true

cspell:
  allow_failure: false
stylelint:
  allow_failure: false
phpcs:
  allow_failure: false
phpstan:
  allow_failure: false
