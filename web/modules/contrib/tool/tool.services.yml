services:
  plugin.manager.tool:
    class: Drupal\tool\Tool\ToolManager
    parent: default_plugin_manager

  plugin.manager.tool.typed_data_adapter:
    class: Drupal\tool\TypedData\Adapter\TypedDataAdapterManager
    parent: default_plugin_manager

  tool.normalizer.context_definition:
    class: Drupal\tool\Normalizer\ContextDefinitionNormalizer
    arguments: ['@event_dispatcher']
    tags:
      - { name: normalizer, priority: 100 }

  tool.definition_serializer:
    class: Drupal\tool\Normalizer\ToolDefinitionSerializer
    arguments: ['@?serializer']

  tool.handle_store:
    class: Drupal\tool\Handle\ToolHandleStore
    arguments: ['@tempstore.private', '@uuid']

  Drupal\tool\Handle\ToolHandleStoreInterface: '@tool.handle_store'

  tool.entity_handle_transformer:
    class: Drupal\tool\Handle\EntityHandleTransformer
    arguments: ['@Drupal\tool\Handle\ToolHandleStoreInterface', '@entity_type.manager']

  tool.entity_handle_transform_subscriber:
    class: Drupal\tool\EventSubscriber\EntityHandleTransformSubscriber
    arguments: ['@tool.entity_handle_transformer']
    tags:
      - { name: event_subscriber }

  tool.recursive_tool_value_transform_subscriber:
    class: Drupal\tool\EventSubscriber\RecursiveToolValueTransformSubscriber
    arguments: ['@event_dispatcher']
    tags:
      - { name: event_subscriber }

  tool.input_type_coercion_subscriber:
    class: Drupal\tool\EventSubscriber\InputTypeCoercionSubscriber
    tags:
      - { name: event_subscriber }

  tool.output_type_coercion_subscriber:
    class: Drupal\tool\EventSubscriber\OutputTypeCoercionSubscriber
    tags:
      - { name: event_subscriber }

  tool.normalizer.map_data_definition:
    class: Drupal\tool\Normalizer\MapDefinitionNormalizer
    tags:
      - { name: normalizer, priority: 100 }

  tool.normalizer.legacy_data_definition:
    class: Drupal\tool\Normalizer\LegacyTypedDataNormalizer
    tags:
      - { name: normalizer, priority: 1000 }

  logger.channel.tool:
    parent: logger.channel_base
    arguments: ['tool']
