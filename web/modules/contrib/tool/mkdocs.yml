# mkdocs configuration for the Tool module.
# Docs live under docs/, entry point docs/index.md.
# Published to GitLab Pages at the site_url below.
site_name: Tool
site_url: https://project.pages.drupalcode.org/tool

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Usage:
      - Tool Explorer: usage/tool-explorer.md
      - Drush commands: usage/drush.md
      - AI function calling: usage/ai-function-calling.md
      - Agent skills: usage/agent-skills.md
  - For Developers:
      - Overview: developers/index.md
      - Creating a tool: developers/creating-a-tool.md
      - Input and output definitions: developers/input-output-definitions.md
      - Events: developers/events.md
      - Entity handles: developers/entity-handles.md
  - Ecosystem:
      - Modules using the Tool API: ecosystem/modules-using-tool-api.md
      - Sources of tools: ecosystem/sources-of-tools.md
